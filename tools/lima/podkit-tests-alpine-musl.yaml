# Lima VM: Alpine 3.23 — Linux test environment (musl, Docker image parity)
#
# Purpose: prove the test suite passes against musl libc, which is what the
# published Docker image runs on. Uses Alpine 3.23 (closest version with
# Lima-compatible cloud images); Docker image uses Alpine 3.21 — the minor
# version difference is acceptable for device manager and test suite validation.
#
# Usage:
#   limactl start tools/lima/podkit-tests-alpine-musl.yaml --name=podkit-tests-alpine-musl
#   limactl shell podkit-tests-alpine-musl
#   # Or use the wrapper: mise run test:linux:alpine
#
# Note: Bun has experimental musl/Alpine support. If Bun fails to install,
# use Node.js + npm as the test runner fallback.

images:
  - location: 'https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/cloud/nocloud_alpine-3.23.3-aarch64-uefi-cloudinit-r0.qcow2'
    arch: 'aarch64'
  - location: 'https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/cloud/nocloud_alpine-3.23.3-x86_64-uefi-cloudinit-r0.qcow2'
    arch: 'x86_64'

# Alpine uses OpenRC, not systemd — disable containerd (we don't need it)
containerd:
  system: false
  user: false

# Share the host filesystem into the VM for running tests against the repo
mounts:
  - location: '~'
    writable: true

# VM resources
cpus: 4
memory: '2GiB'
disk: '4GiB'

provision:
  # System-level dependencies (run as root)
  - mode: system
    script: |
      #!/bin/bash
      set -eux

      echo "=== Enabling community repository ==="
      sed -i 's/^#\(.*\/community\)/\1/' /etc/apk/repositories

      echo "=== Installing system dependencies ==="
      apk update
      # cmake builds koffi from source (no musl prebuilt); eudev-dev provides
      # libudev.h for the `usb` package, which compiles libusb from source on
      # aarch64 musl (its arm64 prebuild is glibc-only).
      apk add \
        build-base \
        python3 \
        cmake \
        eudev-dev \
        pkgconf \
        libgpod-dev \
        glib-dev \
        ffmpeg \
        flac \
        lsblk \
        git \
        curl \
        bash \
        nodejs \
        npm

  # Install Bun as the Lima user (not root — Bun installs to $HOME/.bun/)
  - mode: user
    script: |
      #!/bin/bash
      set -eux

      echo "=== Installing Bun ==="
      # Bun has experimental musl support — this may fail on some architectures
      curl -fsSL https://bun.sh/install | bash || echo "WARN: Bun install failed (musl not supported?). Use node/npm fallback."

      # Add Bun to PATH for future shells
      echo 'export PATH="$HOME/.bun/bin:$PATH"' >> ~/.bashrc
      echo 'export PATH="$HOME/.bun/bin:$PATH"' >> ~/.profile
