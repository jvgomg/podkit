#cloud-config
#
# Proxmox cloud-init user-data template — for a device substrate AND for a
# builder.
#
# Deliberately minimal. This makes a plain Debian box with your key on it and
# nothing else; what turns that box into a substrate or into a builder is
# applied afterwards over ssh by one of the two profile script sets:
#
#   substrate:  scripts/provision-substrate.sh  + scripts/substrate-doctor.sh
#   builder:    scripts/provision-builder.sh    + scripts/builder-doctor.sh
#
# Those two profiles CONTRADICT each other — the substrate forbids the very
# toolchain the builder requires (ADR-029 §4) — and this file is shared between
# them precisely because it takes no position on either. It is provisioner-level
# and contract-free, so the only thing that differs between the two guests is
# the hostname substituted below.
#
# That is why there is no second, builder-specific template. A near-identical
# copy would encode no difference and could drift from this one; the difference
# belongs in the profile scripts, which is where the doctors look for it.
#
# The Lima path does exactly the same thing (see podkit-device.yaml), so the
# gadget module stack, `dummy_hcd num=4`, configfs and the no-toolchain
# assertion exist in one place rather than being re-encoded here. Anything
# added to this file that a Lima substrate does not also get is a divergence
# the doctor will not catch, because the doctor asserts the contract — not
# whatever this template happens to say.
#
# Placeholders, substituted by hand for now (see
# docs/environments/device-substrate-proxmox.md and
# docs/environments/builder-proxmox.md):
#
#   __HOSTNAME__    hostname for the guest, e.g. podkit-substrate / podkit-builder
#   __SSH_PUBKEY__  the full public key line you will connect with
#
# Nothing machine-specific is committed: the rendered copy lives on your PVE
# host's snippet storage, never in the repo.
#
# It lives under `substrate/proxmox/` because that is where it landed first, and
# `substrate/ci/boot-substrate.sh` reads it from there by relative path. The
# directory name is historical; the file is shared.

hostname: __HOSTNAME__

# Password auth off, root login off, one unprivileged account reached by key.
# NOPASSWD sudo is required rather than convenient: the harness runs
# `sudo bash …` over a non-interactive ssh session, which has no tty to answer
# a password prompt on.
users:
  - name: podkit
    shell: /bin/bash
    lock_passwd: true
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    ssh_authorized_keys:
      - __SSH_PUBKEY__

ssh_pwauth: false
disable_root: true

# qemu-guest-agent lets the PVE host see the guest's IP and shut it down
# cleanly, which the lifecycle verbs will want. It matters more for a builder
# than for a substrate, because a builder is shut down after every build. It is
# part of neither contract — a guest provisioned any other way does not need
# it.
package_update: true
packages:
  - qemu-guest-agent

runcmd:
  - [systemctl, enable, --now, qemu-guest-agent]
