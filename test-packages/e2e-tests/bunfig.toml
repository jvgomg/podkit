# The preload registers docker container signal handlers so SIGINT during a
# `test:docker` run cleans up any spawned Navidrome / Subsonic containers.
# Host-only `test:e2e` runs load it too — the preload is a no-op when Docker
# isn't reachable (the orphan check catches its own errors).
[test]
preload = ["./src/setup/preload.ts"]
# retry = 0 is repo policy: a test that passes on the second attempt is a bug
# report, not a pass. See docs/agents/testing.md §Retries for why, and for how to
# grant an exception if you genuinely need one.
retry = 0
