# Lima VM: device substrate (Debian 12 — minimal, binary-only)
#
# Role: provide a Linux kernel and userland the device-testing harness can
# synthesise USB gadgets in, and run the statically-linked podkit linux binary
# produced by the builder VM (test-packages/lima/vms/podkit-builder-glibc.yaml)
# against them.
#
# Boots as Lima instance name: `podkit-device`.
#
# This file provisions NOTHING beyond a plain Debian box. That is deliberate.
# What makes a box a *substrate* — the gadget module stack, `dummy_hcd num=4`,
# configfs, the runtime-only package set, and the assertion that no toolchain
# or `-dev` package is present — is declared once, as portable Debian bash, in:
#
#   test-packages/device-testing/scripts/substrate-contract.sh    (the values)
#   test-packages/device-testing/scripts/provision-substrate.sh   (apply them)
#   test-packages/device-testing/scripts/substrate-doctor.sh      (assert them)
#
# `bun run harness:setup` copies those in and runs them post-boot. A Proxmox
# substrate reached over ssh runs the identical three files. Lima is a
# provisioner here, not the substrate — its entire output is an SSH-reachable
# Debian box (see ADR-028 and CONTEXT.md §Test environments).
#
# Provisioning runs post-boot rather than from a `provision:` block because
# Lima's provision entries take an inline `script` or inline `content` and
# cannot reference a file — so any in-YAML form would re-encode the scripts
# here and drift from them.
#
# Usage (manual):
#   bun run vm:up device            # create/start
#   bun run harness:setup           # apply the contract, verify it, install binaries
#   bun run vm:shell device         # interactive shell
#   bun run vm:down device          # stop
#
# Verify the substrate contract at any time:
#   limactl copy test-packages/device-testing/scripts/substrate-*.sh podkit-device:/tmp/
#   limactl shell podkit-device -- sudo bash /tmp/substrate-doctor.sh

# Pin the Apple Virtualization framework backend. `vz` boots ~5s vs ~30s for
# `qemu` on aarch64 hosts, and the state-mutation path uses `apply-state.sh`
# (sub-2-second per flip — see ADR-016 §"Test speed strategy") rather than
# `limactl snapshot`, which is QEMU-only in Lima 2.x. Explicit pinning prevents
# implicit reliance on the user's default driver.
vmType: 'vz'

images:
  # Debian 12.10 point release. Pinned in sync with podkit-builder-glibc.yaml
  # and podkit-abi-verify.yaml — bumping requires updating all three files plus
  # a re-run of the ABI spike to confirm the static binary still loads.
  #
  # substrate-doctor.sh asserts the Debian MAJOR version hard and reports a
  # differing point release as drift rather than failing it: which image was
  # booted is a provisioning input, while the running point release advances
  # with any security update.
  - location: 'https://cloud.debian.org/images/cloud/bookworm/20250316-2053/debian-12-generic-arm64-20250316-2053.qcow2'
    arch: 'aarch64'
  - location: 'https://cloud.debian.org/images/cloud/bookworm/20250316-2053/debian-12-generic-amd64-20250316-2053.qcow2'
    arch: 'x86_64'

# No host mount. Binaries are delivered by explicit copy, and nothing else is.
# Lima's default $HOME mount would make the host's node_modules, libgpod-dev and
# Bun install visible inside the substrate — re-introducing exactly the
# dev-library shadowing that the binary-only invariant exists to rule out.
# ADR-016 §"Builder/test VM split" forbids it. It is also what makes an SSH
# substrate a drop-in: there is no host filesystem to reproduce.
mounts: []

# Sizing — runs the compiled binaries plus, for the Docker tier, builds and runs
# the podkit image in-VM (nerdctl/containerd). The disk needs headroom for image
# layers, base-image pulls and build cache; a near-full 6GiB root wedged an
# unclean-stop boot, so it is sized up here.
cpus: 2
memory: '2GiB'
disk: '20GiB'
