[tools]
bun = "1.3.13"
lima = "2.1.1"
rust = "latest"
python = "3.12"

# FFmpeg. Pinned via the explicit `conda:` backend rather than the bare
# `ffmpeg` registry name: that name also resolves to an asdf plugin which
# compiles from source, and the registry's backend order is not a contract.
# The conda-forge `gpl_*` build (highest build number on linux-64, osx-64 and
# osx-arm64 alike) is the one variant carrying every encoder
# @podkit/test-fixtures asserts on — libvorbis, libopus, libmp3lame, aac, flac,
# mjpeg, plus libx264/libvpx-vp9 for the video fixtures. Stock Homebrew ffmpeg
# omits libvorbis, which is why contributors previously needed a brew tap.
"conda:ffmpeg" = "9.0.1"

# metaflac, for the FLAC tag assertions in @podkit/test-fixtures and the e2e
# suites that call `requireMetaflac()`. Pinned via conda for the same reason as
# ffmpeg: one version on every platform, no brew tap or apt package to chase.
# It cannot ride along with `conda:ffmpeg` — that build *contains* metaflac but
# only exposes ffmpeg/ffplay/ffprobe, so the binary is present and unreachable.
"conda:libflac" = "1.5.0"

# Shell linting. The repo has 29 shell scripts, several of them load-bearing
# and privileged (apply-state.sh runs as root in the substrate;
# select-gpod-prebuild.sh picks the libc variant, and a wrong pick ships a
# binary that dies at dlopen). Four of them already carried `# shellcheck`
# directives before this was pinned, so the annotations existed for a linter
# nobody could run.
shellcheck = "0.11.0"

# LSP for Claude
"npm:typescript" = "6.0.3"
"npm:typescript-language-server" = "5.3.0"

# Knowledge-graph tool (see CLAUDE.md). Pinned as a project tool so every
# clone resolves the same version, and so the committed .husky/post-commit
# hook can find it on PATH via the mise shims.
"pipx:graphifyy" = { version = "0.9.55", extras = ["mcp"] }

# Backlog CLI. Pinned here rather than installed globally because .mcp.json
# starts it as an MCP server, and a project tool is not on plain PATH - hence
# the `mise exec` wrapper there.
"npm:backlog.md" = "1.51.0"

[env]
# Add local bin directory to PATH for project tools
_.path = ["./bin"]

[tasks."graph:build"]
description = "Build the graphify knowledge graph (AST-only, offline, no API cost)"
run = """
#!/usr/bin/env bash
set -euo pipefail

if ! command -v graphify >/dev/null 2>&1; then
  echo "graphify not found. Run 'mise install' first (it is pinned in mise.toml)." >&2
  exit 1
fi

# `update` re-extracts every code file and rewrites graphify-out/, so it works
# equally as a first build on a fresh clone and as a refresh afterwards.
# --force lets it overwrite a graph that has more nodes than the rebuild, which
# is correct after a branch switch or a refactor that deleted code.
graphify update . --force
"""

[tasks."tools:build"]
description = "Build all native tools (gpod-tool)"
run = """
#!/usr/bin/env bash
set -e

# Set up libgpod paths (macOS local build)
export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
export DYLD_LIBRARY_PATH="$HOME/.local/lib:${DYLD_LIBRARY_PATH:-}"

mkdir -p bin
echo "Building gpod-tool..."
make -C tools/gpod-tool clean
make -C tools/gpod-tool
cp tools/gpod-tool/gpod-tool bin/
echo "Tools built successfully. Available in ./bin/"
echo ""
echo "Run 'mise trust' and restart your shell, then gpod-tool will be in PATH."
"""

[tasks."tools:clean"]
description = "Clean all native tool builds"
run = """
#!/usr/bin/env bash
set -e
rm -rf bin
make -C tools/gpod-tool clean 2>/dev/null || true
echo "Cleaned."
"""

[tasks."tools:brew-test"]
description = "Smoke test the brew install of podkit on Debian (via Docker)"
run = """
#!/usr/bin/env bash
set -e
docker compose -f tools/brew-test/docker-compose.yml up --build --exit-code-from smoke-test
"""

# ---------------------------------------------------------------------------
# Generic VM lifecycle lives in @podkit/lima's `podkit-vm` CLI, mirrored at the
# repo root as `bun run vm:up|vm:down|vm:destroy|vm:status|vm:recover|vm:shell
# <instance>`. Device-specific provisioning (binaries, systemd unit, baseline
# hash) stays in @podkit/device-testing as `bun run harness:setup|install|status`.
# The Linux-build turbo tasks (`@podkit/device-testing#build:linux-binary` etc.)
# create + start their builder VM on demand through the same CLI, so a developer
# rarely touches it directly. See:
#   - test-packages/lima/src/cli.ts (podkit-vm)
#   - test-packages/device-testing/scripts/harness.ts (device provisioning)
#   - docs/agents/device-testing.md (developer quick start)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Linux test VMs (Lima — cross-platform testing on Debian + Alpine)
# ---------------------------------------------------------------------------

[tasks."test:linux"]
description = "Run test suite on both Linux VMs (Debian + Alpine)"
run = "tools/lima/run-tests.sh all"

[tasks."test:linux:debian"]
description = "Run test suite on Debian VM (glibc — general Linux env)"
run = "tools/lima/run-tests.sh debian"

[tasks."test:linux:alpine"]
description = "Run test suite on Alpine VM (musl — Docker image parity)"
run = "tools/lima/run-tests.sh alpine"

# Lifecycle routes through the podkit-vm CLI rather than raw limactl so every
# stop/destroy of these instances shares the one code path (and the one lock)
# that `run-tests.sh` uses to start them.
[tasks."test:linux:stop"]
description = "Stop Linux test VMs (preserves state and turbo cache)"
run = """
bun test-packages/lima/src/cli.ts stop podkit-test-glibc
bun test-packages/lima/src/cli.ts stop podkit-test-musl
"""

[tasks."test:linux:destroy"]
description = "Delete Linux test VMs entirely (wipes turbo cache too)"
run = """
bun test-packages/lima/src/cli.ts destroy podkit-test-glibc --yes
bun test-packages/lima/src/cli.ts destroy podkit-test-musl --yes
"""

[tasks."test:linux:cache:clear"]
description = "Clear turbo cache inside Linux test VMs without deleting them"
run = """
limactl shell podkit-test-glibc -- rm -rf ~/.cache/podkit-turbo 2>/dev/null || true
limactl shell podkit-test-musl -- rm -rf ~/.cache/podkit-turbo 2>/dev/null || true
echo Done.
"""

# ---------------------------------------------------------------------------
# Virtual iPod (Lima VM + server)
# ---------------------------------------------------------------------------

[tasks."vipod:create"]
description = "Create the virtual iPod Lima VM"
run = "limactl create --name podkit-virtual-ipod test-packages/lima/vms/podkit-virtual-ipod.yaml"

[tasks."vipod:start"]
description = "Start the virtual iPod VM"
run = "limactl start podkit-virtual-ipod"

[tasks."vipod:stop"]
description = "Stop the virtual iPod VM"
run = "limactl stop podkit-virtual-ipod"

[tasks."vipod:shell"]
description = "Open an isolated shell in the VM (simulates SSH with podkit installed)"
run = "limactl shell podkit-virtual-ipod -- sudo -iu james"

[tasks."vipod:install"]
description = "Build podkit for Linux and install to /usr/local/bin inside the VM"
run = """
#!/usr/bin/env bash
set -e

# The VM-local destination is declared in @podkit/lima's staging-area registry
# alongside every other one, so collisions are a property of a single file.
VM_DIR="$(bun test-packages/lima/src/cli.ts stage-path podkit-virtual-ipod --area virtualIpod)"

# Staging shares the exclude floor + exit-24 tolerance with every other VM
# caller. --sudo because /opt is not writable by the VM user; `build` and
# prebuilds/ are extra prunes because this VM rebuilds the native binding
# itself. The host source root is the repo the CLI itself lives in, so there is
# no hard-coded home directory here.
echo "=== Syncing source to VM-local directory ==="
bun test-packages/lima/src/cli.ts stage podkit-virtual-ipod \
  --dest "$VM_DIR" \
  --sudo \
  --exclude build \
  --exclude 'packages/libgpod-node/prebuilds'

echo "=== Installing dependencies ==="
limactl shell podkit-virtual-ipod -- sudo bash -c "cd $VM_DIR && bun install"

echo "=== Building native libgpod binding for Linux ==="
limactl shell podkit-virtual-ipod -- sudo bash -c "cd $VM_DIR/packages/libgpod-node && bunx node-gyp rebuild"

echo "=== Building packages ==="
limactl shell podkit-virtual-ipod -- sudo bash -c "
  cd $VM_DIR && bun turbo build \
    --filter=@podkit/core \
    --filter=podkit \
    --filter=@podkit/libgpod-node \
    --filter=@podkit/ipod-db \
    --filter=@podkit/ipod-web \
    --filter=@podkit/virtual-ipod-server \
    --filter=@podkit/virtual-ipod-app
"

echo "=== Compiling podkit binary ==="
limactl shell podkit-virtual-ipod -- sudo bash -c "cd $VM_DIR/packages/podkit-cli && bash scripts/compile.sh"

echo "=== Installing to /usr/local/bin ==="
limactl shell podkit-virtual-ipod -- sudo bash -c "
  cp $VM_DIR/packages/podkit-cli/bin/podkit /usr/local/bin/podkit
  chmod +x /usr/local/bin/podkit
  chown -R james:james /home/james
"

echo "=== Installing shell completions ==="
limactl shell podkit-virtual-ipod -- sudo -u james bash -c 'mkdir -p ~/.bashrc.d && podkit completions bash > ~/.bashrc.d/podkit'
limactl shell podkit-virtual-ipod -- sudo -u james bash << 'BASHRC'
grep -q bashrc.d ~/.bashrc 2>/dev/null || cat >> ~/.bashrc << 'EOF'
for f in ~/.bashrc.d/*; do source "$f"; done
EOF
BASHRC

echo ""
echo "=== Done ==="
limactl shell podkit-virtual-ipod -- sudo -iu james podkit --version
echo "podkit installed. Run: mise run vipod:shell"
"""

[tasks."vipod:server"]
description = "Start the virtual iPod server inside the VM"
run = "limactl shell podkit-virtual-ipod -- sudo bash -c 'cd /opt/podkit/packages/virtual-ipod-server && bun run src/main.ts'"

[tasks."vipod:plug"]
description = "Plug the virtual iPod into USB"
run = """
curl -s -X POST -H 'Content-Type: application/json' \
  -d '{"ipodId":"default"}' \
  http://localhost:3456/usb/plug && echo 'Plugged in'
"""

[tasks."vipod:unplug"]
description = "Unplug the virtual iPod from USB"
run = "curl -s -X POST http://localhost:3456/usb/unplug && echo 'Unplugged'"

[tasks."vipod:status"]
description = "Check virtual iPod storage and USB status"
run = """
echo '=== iPod Storages ===' && \
curl -s http://localhost:3456/ipods | python3 -m json.tool && \
echo '=== USB Bus ===' && \
curl -s http://localhost:3456/usb/status | python3 -m json.tool
"""

[tasks."vipod:wipe"]
description = "Wipe the virtual iPod storage and recreate it"
run = """
curl -s -X DELETE http://localhost:3456/ipods/default > /dev/null && \
curl -s -X POST -H 'Content-Type: application/json' \
  -d '{"id":"default"}' \
  http://localhost:3456/ipods | python3 -m json.tool
"""

[tasks."vipod:destroy"]
description = "Delete the virtual iPod VM entirely"
run = "limactl delete podkit-virtual-ipod --force 2>/dev/null; echo Done."

[tasks."tools:check"]
description = "Build and test all native tools"
depends = ["tools:build"]
run = """
#!/usr/bin/env bash
set -e

# Set up libgpod paths (macOS local build)
export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
export DYLD_LIBRARY_PATH="$HOME/.local/lib:${DYLD_LIBRARY_PATH:-}"

echo "Running gpod-tool tests..."
make -C tools/gpod-tool check
"""
