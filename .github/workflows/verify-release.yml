name: Verify Release (Version PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

# The docker job pushes a single MOVING :rc tag. Two rapid pushes to the same
# Version PR would otherwise race that tag (last-writer-wins) and hand rc
# discovery a nondeterministic image — so supersede in-flight runs per PR.
concurrency:
  group: verify-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Only run when this is a "Version Packages" PR from changesets
  check-pr:
    runs-on: ubuntu-latest
    outputs:
      is_version_pr: ${{ steps.check.outputs.is_version_pr }}
    steps:
      - name: Check if Version Packages PR
        id: check
        run: |
          if [[ "${{ github.event.pull_request.title }}" == "Version Packages" ]]; then
            echo "is_version_pr=true" >> "$GITHUB_OUTPUT"
            echo "This is a Version Packages PR - running release verification"
          else
            echo "is_version_pr=false" >> "$GITHUB_OUTPUT"
            echo "Not a Version Packages PR - skipping"
          fi

  # Build, compile, and smoke test CLI binaries for all platforms
  build:
    needs: check-pr
    if: needs.check-pr.outputs.is_version_pr == 'true'
    uses: ./.github/workflows/build-platform.yml
    with:
      upload-artifacts: true

  # Read the release-candidate version from the PR branch so the :rc image is
  # stamped with the real version (VERSION build-arg / image label). Because the
  # docker build runs in pre-release-tag mode, this version is never turned into
  # a pushed tag — only the moving :rc tag is pushed.
  rc-version:
    needs: check-pr
    if: needs.check-pr.outputs.is_version_pr == 'true'
    runs-on: ubuntu-latest
    name: Read RC version
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read release-candidate version
        id: read
        run: echo "version=$(jq -r .version packages/podkit-cli/package.json)" >> "$GITHUB_OUTPUT"

  # Build the release-candidate image and push it as the single moving :rc
  # pre-release tag — never the :latest / :<version> / :<minor> release tags.
  # Stays multi-arch so amd64 build verification + release cache warming are
  # preserved and :rc mirrors the release manifest. The push is gated to
  # same-repo (non-fork) PRs so a fork PR titled "Version Packages" cannot push
  # an image built from untrusted code.
  docker:
    needs: [check-pr, build, rc-version]
    if: >-
      needs.check-pr.outputs.is_version_pr == 'true' &&
      needs.build.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.rc-version.outputs.version }}
      push: true
      prerelease-tag: rc
    permissions:
      contents: read
      packages: write

  # Verify the docs site builds — we don't want to merge a Version Packages PR
  # if the post-release docs deploy would fail.
  docs:
    needs: check-pr
    if: needs.check-pr.outputs.is_version_pr == 'true'
    runs-on: ubuntu-latest
    name: Verify Docs Build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      # docs-site imports runtime values from @podkit/devices-ipod (dist-based),
      # so its dist must exist before astro build. Build only that pure-TS chain
      # (device-types + ipod-firmware + devices-ipod) — it pulls no native
      # libgpod, so a bare runner can build it. @podkit/compatibility resolves
      # from source and imports libgpod-node type-only, so it needs no build.
      - name: Build docs workspace deps
        run: bunx turbo run build --filter=@podkit/devices-ipod
      - name: Build docs site
        run: cd packages/docs-site && bun run build

  # Summary job for branch protection rules
  release-ci-passed:
    needs: [check-pr, build, docker, docs]
    if: always()
    runs-on: ubuntu-latest
    name: Release CI Status
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.check-pr.outputs.is_version_pr }}" != "true" ]]; then
            echo "Not a version PR - skipping"
            exit 0
          fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build jobs failed or were cancelled"
            exit 1
          fi
          if [[ "${{ needs.docker.result }}" != "success" ]]; then
            echo "Docker build failed or was cancelled"
            exit 1
          fi
          if [[ "${{ needs.docs.result }}" != "success" ]]; then
            echo "Docs build failed or was cancelled"
            exit 1
          fi
          echo "All release CI checks passed"
