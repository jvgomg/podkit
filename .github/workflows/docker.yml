name: Build Docker Image

on:
  workflow_call:
    inputs:
      version:
        description: 'Version tag for the image (e.g., 0.5.0)'
        required: true
        type: string
      push:
        description: 'Push image to registry'
        required: false
        default: false
        type: boolean
      platforms:
        description: 'Comma-separated build platforms'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string
      prerelease-tag:
        description: >-
          When set, push ONLY this single tag (e.g. `edge`) and SKIP the
          :latest / :<version> / :<minor> release tags. Leave empty for a
          normal release build.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    name: Build & Push Docker Image

    steps:
      - uses: actions/checkout@v4

      - name: Extract component versions
        id: versions
        run: |
          echo "cli=$(jq -r '.version' packages/podkit-cli/package.json)" >> "$GITHUB_OUTPUT"
          echo "daemon=$(jq -r '.version' packages/podkit-daemon/package.json)" >> "$GITHUB_OUTPUT"

      # amd64 artifacts are only produced/needed when linux/amd64 is a target
      # platform. An arm64-only build (e.g. the edge image) skips these.
      - name: Download Linux amd64 binary
        if: contains(inputs.platforms, 'amd64')
        uses: actions/download-artifact@v4
        with:
          name: podkit-linux-x64
          path: docker-artifacts/

      - name: Download Linux arm64 binary
        if: contains(inputs.platforms, 'arm64')
        uses: actions/download-artifact@v4
        with:
          name: podkit-linux-arm64
          path: docker-artifacts/

      - name: Download Linux amd64 daemon binary
        if: contains(inputs.platforms, 'amd64')
        uses: actions/download-artifact@v4
        with:
          name: podkit-daemon-linux-x64
          path: docker-daemon-artifacts/

      - name: Download Linux arm64 daemon binary
        if: contains(inputs.platforms, 'arm64')
        uses: actions/download-artifact@v4
        with:
          name: podkit-daemon-linux-arm64
          path: docker-daemon-artifacts/

      - name: Prepare binaries for multi-arch build
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -e
          # Stage bin/<docker-arch>/{podkit,podkit-daemon} for each target
          # platform. $1 = docker arch (amd64|arm64); $2 = artifact suffix
          # (x64|arm64) — the tarballs are named by the latter.
          prep() {
            mkdir -p "bin/$1"
            tar xzf "docker-artifacts/podkit-linux-$2.tar.gz" -C "bin/$1/"
            tar xzf "docker-daemon-artifacts/podkit-daemon-linux-$2.tar.gz" -C "bin/$1/"
            chmod +x "bin/$1/podkit" "bin/$1/podkit-daemon"
            echo "--- $1 binaries ---"
            file "bin/$1/podkit" "bin/$1/podkit-daemon"
          }
          case "$PLATFORMS" in *amd64*) prep amd64 x64 ;; esac
          case "$PLATFORMS" in *arm64*) prep arm64 arm64 ;; esac
          # Fail-closed libc gate: the Alpine image can only run musl binaries.
          # Assert every staged binary requests the musl program interpreter
          # (ld-musl-*), never glibc's ld-linux. A glibc/-gnu naming slip
          # feeding the wrong artifact here must fail the build, not ship.
          for bin in bin/*/podkit bin/*/podkit-daemon; do
            [ -f "$bin" ] || continue
            interp=$(readelf -l "$bin" | grep -oE 'Requesting program interpreter: [^]]+' || true)
            echo "$bin -> $interp"
            case "$interp" in
              *ld-musl*) ;;
              *) echo "ERROR: $bin is not a musl binary (expected ld-musl interpreter); refusing to bake into the Alpine image"; exit 1;;
            esac
            case "$interp" in
              *ld-linux*) echo "ERROR: $bin has a glibc (ld-linux) interpreter; wrong artifact for the Alpine image"; exit 1;;
            esac
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        id: tags
        env:
          PRERELEASE_TAG: ${{ inputs.prerelease-tag }}
        run: |
          REPO="ghcr.io/jvgomg/podkit"

          if [ -n "$PRERELEASE_TAG" ]; then
            # Pre-release (e.g. edge): a single moving tag, never the release
            # tags. Overwriting one tag keeps GHCR bloat bounded.
            TAGS="${REPO}:${PRERELEASE_TAG}"
          else
            VERSION="${{ inputs.version }}"
            TAGS="${REPO}:${VERSION}"
            TAGS="${TAGS},${REPO}:latest"

            # Add major.minor tag (e.g., 0.5)
            MINOR=$(echo "$VERSION" | sed -n 's/^\([0-9]*\.[0-9]*\).*/\1/p')
            if [ -n "$MINOR" ]; then
              TAGS="${TAGS},${REPO}:${MINOR}"
            fi
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/podkit-docker/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ inputs.version }}
            CLI_VERSION=${{ steps.versions.outputs.cli }}
            DAEMON_VERSION=${{ steps.versions.outputs.daemon }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          # Intentionally one shared cache scope for release and edge builds:
          # both build the same Dockerfile from musl binaries, so an edge push
          # keeps the release cache warm (and vice versa). buildx layers are
          # content-addressed, so this is a cache-hit optimisation, never a
          # correctness coupling. Split the scope only if edge builds ever need
          # to be isolated from the release cache.
          cache-from: type=gha,scope=docker-main
          cache-to: type=gha,mode=max,scope=docker-main
