name: Prune GHCR untagged images

# The release-candidate build (verify-release.yml) overwrites a single moving
# `:rc` tag on each "Version Packages" PR build. Each overwrite leaves the
# previous manifest untagged. This job sweeps those untagged manifests weekly
# so the `ghcr.io/jvgomg/podkit` package doesn't accumulate orphaned layers.
#
# `delete-only-untagged-versions: true` guarantees no tagged image — no
# release (:latest / :<version> / :<minor>) and not the live :rc — is ever
# removed.

on:
  schedule:
    # Mondays 04:00 UTC.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    name: Delete untagged GHCR versions
    steps:
      - name: Prune untagged podkit image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: podkit
          package-type: container
          delete-only-untagged-versions: true
