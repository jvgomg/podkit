[test]
# Bare `bun test` and `bun run test:unit` skip integration + perf tests by
# default — they need system deps (libgpod-node, gpod-tool, ffmpeg) that not
# every contributor has installed. `bun run test:integration` and `test:perf`
# clear this with `--path-ignore-patterns=` and use a pattern filter.
# Per-file requirements are declared at module load via requireFFmpeg() /
# requireGpodTool() / requireLibgpodNode() from `@podkit/test-fixtures` and
# `@podkit/libgpod-node`.
pathIgnorePatterns = ["**/*.integration.test.ts", "**/*.perf.test.ts"]
# retry = 0 is repo policy: a test that passes on the second attempt is a bug
# report, not a pass. See docs/agents/testing.md §Retries for why, and for how to
# grant an exception if you genuinely need one.
retry = 0
